name: Validate signing credentials without publication

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        environment: [package-signing, package-signing-edge]
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: validator
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: baab5d5ce038d36442d9d6b3cc80aaa282d488cb
          persist-credentials: false
          path: publisher
      - name: Prepare tools without credentials
        working-directory: publisher
        run: |
          set -euo pipefail
          case $(findmnt -n -o FSTYPE -T "$RUNNER_TEMP") in ''|tmpfs|ramfs) exit 1;; esac
          mkdir -m700 "$RUNNER_TEMP/credential-check"
          docker build --build-arg BASE_IMAGE=archlinux:base-devel -f .github/publisher.Dockerfile -t credential-validator .
      - name: Sign and verify disposable challenge
        env:
          PACMAN_SIGNING_SUBKEY_B64: ${{ secrets.PACMAN_SIGNING_SUBKEY_B64 }}
          PACMAN_SIGNING_PASSPHRASE: ${{ secrets.PACMAN_SIGNING_PASSPHRASE }}
          PACMAN_SIGNING_PRIMARY_FPR: ${{ vars.PACMAN_SIGNING_PRIMARY_FPR }}
          PACMAN_SIGNING_SUBKEY_FPR: ${{ vars.PACMAN_SIGNING_SUBKEY_FPR }}
        run: |
          set -euo pipefail
          docker run --rm --network none \
            -v "$PWD/publisher:/publisher:ro" -v "$PWD/validator:/validator:ro" \
            -v "$RUNNER_TEMP/credential-check:/tmp" \
            -e TMPDIR=/tmp -e TMP=/tmp -e TEMP=/tmp -e PYTHONDONTWRITEBYTECODE=1 \
            -e PACMAN_SIGNING_SUBKEY_B64 -e PACMAN_SIGNING_PASSPHRASE \
            -e PACMAN_SIGNING_PRIMARY_FPR -e PACMAN_SIGNING_SUBKEY_FPR \
            credential-validator python3 /validator/scripts/validate-signing-credentials.py /publisher
      - name: Remove temporary validation material
        if: always()
        run: sudo rm -rf -- "$RUNNER_TEMP/credential-check"
