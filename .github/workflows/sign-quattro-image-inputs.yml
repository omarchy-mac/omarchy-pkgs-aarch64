name: Sign quattro image inputs

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful main-branch Build quattro image inputs run
        type: string
        required: true
      artifact_name:
        description: Exact unsigned candidate artifact name from that run
        type: string
        required: true
      manifest_sha256:
        description: Reviewed SHA256 of the unsigned manifest.json
        type: string
        required: true
      source_revision:
        description: Reviewed full desktop source commit
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  sign:
    if: github.repository == 'omarchy-mac/omarchy-pkgs-aarch64' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: package-signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check candidate origin
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: |
          set -euo pipefail
          [[ $RUN_ID =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/run.json"
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .conclusion == "success" and .head_branch == "main" and
            .head_repository.full_name == $repo and
            .path == ".github/workflows/build-quattro-image-inputs.yml" and
            (.event == "push" or .event == "schedule" or .event == "workflow_dispatch")
          ' "$RUNNER_TEMP/run.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" --jq '.jobs[] | select(.name == "Build three candidate packages" and .conclusion == "success") | .id' > "$RUNNER_TEMP/build-job"
          [[ -s $RUNNER_TEMP/build-job ]]
          [[ $ARTIFACT_NAME == quattro-image-inputs-* && $ARTIFACT_NAME != quattro-image-inputs-logs-* ]]
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          name: ${{ inputs.artifact_name }}
          path: candidate-input
      - name: Prepare tools without credentials
        run: |
          set -euo pipefail
          case $(findmnt -n -o FSTYPE -T "$RUNNER_TEMP") in ''|tmpfs|ramfs) exit 1;; esac
          mkdir -m700 "$RUNNER_TEMP/candidate-signing"
          mkdir "$RUNNER_TEMP/candidate-signing/tmp"
          docker build --build-arg BASE_IMAGE=archlinux:base-devel -f .github/publisher.Dockerfile -t candidate-signer .
      - name: Validate and sign exact candidate bytes without network access
        env:
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
          PACMAN_SIGNING_SUBKEY_B64: ${{ secrets.PACMAN_SIGNING_SUBKEY_B64_20260914 }}
          PACMAN_SIGNING_PASSPHRASE: ${{ secrets.PACMAN_SIGNING_PASSPHRASE_20260914 }}
          PACMAN_SIGNING_PRIMARY_FPR: ${{ vars.PACMAN_SIGNING_PRIMARY_FPR_20260914 }}
          PACMAN_SIGNING_SUBKEY_FPR: ${{ vars.PACMAN_SIGNING_SUBKEY_FPR_20260914 }}
        run: |
          set -euo pipefail
          docker run --rm --network none \
            -v "$PWD:/source:ro" -v "$RUNNER_TEMP/candidate-signing:/output" \
            -e TMPDIR=/output/tmp -e PYTHONDONTWRITEBYTECODE=1 \
            -e PACMAN_SIGNING_SUBKEY_B64 -e PACMAN_SIGNING_PASSPHRASE \
            -e PACMAN_SIGNING_PRIMARY_FPR -e PACMAN_SIGNING_SUBKEY_FPR \
            candidate-signer python3 /source/scripts/sign-quattro-image-inputs.py \
            /source/candidate-input /output/signed \
            --manifest-sha256 "$MANIFEST_SHA256" --source-revision "$SOURCE_REVISION"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/candidate-signing/signed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-quattro-image-inputs-${{ inputs.source_revision }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-signing/signed/
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing material
        if: always()
        run: sudo rm -rf -- "$RUNNER_TEMP/candidate-signing"
