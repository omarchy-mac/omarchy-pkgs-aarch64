name: Prepare complete baseline artifact

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: 'Reviewed exact desktop source commit, with fork keyring bootstrap support'
        type: string
        required: true
      capture_run_id:
        description: 'Same-repository run retaining the reviewed capture'
        type: string
        required: true
      capture_artifact_name:
        description: 'Exact retained capture artifact name (including run attempt)'
        type: string
        required: true
      capture_manifest_sha256:
        description: 'Operator-approved capture-manifest.json SHA256; never derive approval from download'
        type: string
        required: true
      edge_conversion:
        description: 'Prepare final stable edge signing conversion; require identical existing package payloads and reuse exact archive bytes'
        type: boolean
        required: true
        default: false
      pkgrel:
        description: 'Explicit package release number for this rebuild; bump when package bytes or metadata change'
        type: string
        required: true

concurrency:
  group: rc-baseline-producer
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    environment: package-signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate immutable inputs
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          EDGE_CONVERSION: ${{ inputs.edge_conversion && '1' || '0' }}
          CAPTURE_HASH: ${{ inputs.capture_manifest_sha256 }}
          CAPTURE_RUN: ${{ inputs.capture_run_id }}
          CAPTURE_NAME: ${{ inputs.capture_artifact_name }}
          PKGREL: ${{ inputs.pkgrel }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ && "$CAPTURE_HASH" =~ ^[a-f0-9]{64}$ && "$CAPTURE_RUN" =~ ^[1-9][0-9]*$ && "$CAPTURE_NAME" =~ ^[a-zA-Z0-9._-]+$ && "$PKGREL" =~ ^[1-9][0-9]*$ ]]
          case $(findmnt -n -o FSTYPE -T "$RUNNER_TEMP") in ''|tmpfs|ramfs) exit 1;; esac
          mkdir -p "$RUNNER_TEMP/rc-producer"/{tmp,cache,built,logs,output}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: omarchy-mac/omarchy-mac
          ref: ${{ inputs.source_commit }}
          path: vendor/desktop
          persist-credentials: false
      - name: Read exact recipe pin
        id: recipe
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          EDGE_CONVERSION: ${{ inputs.edge_conversion && '1' || '0' }}
        run: |
          set -euo pipefail
          [[ $(git -C vendor/desktop rev-parse HEAD) == "$SOURCE_COMMIT" ]]
          pin=$(cat vendor/desktop/build-inputs/omarchy-pkgs-revision)
          [[ "$pin" =~ ^[a-f0-9]{40}$ ]]
          echo "revision=$pin" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: omacom/omarchy-pkgs
          ref: ${{ steps.recipe.outputs.revision }}
          path: vendor/recipes
          persist-credentials: false
      - name: Prepare tools without signing credentials
        run: docker build --build-arg BASE_IMAGE=menci/archlinuxarm:base-devel -f .github/publisher.Dockerfile -t omarchy-producer .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.capture_run_id }}
          name: ${{ inputs.capture_artifact_name }}
          path: ${{ runner.temp }}/rc-capture
      - name: Verify externally approved retained capture before package builds
        env:
          CAPTURE_HASH: ${{ inputs.capture_manifest_sha256 }}
        run: |
          set -euo pipefail
          docker run --rm --network none -v "$PWD:/w:ro" -w /w \
            -v "$RUNNER_TEMP/rc-capture:/capture:ro" -v "$RUNNER_TEMP/rc-producer/tmp:/task/tmp" \
            -e CAPTURE_HASH -e TMPDIR=/task/tmp -e TMP=/task/tmp -e TEMP=/task/tmp -e PYTHONDONTWRITEBYTECODE=1 \
            omarchy-producer bash -euo pipefail -c \
            'python3 scripts/bootstrap-rc.py check-capture --capture /capture --manifest-sha256 "$CAPTURE_HASH"' \
            2>&1 | tee "$RUNNER_TEMP/rc-producer/logs/check-capture.log"
      - name: Build the canonical exact-source package inputs on ARM
        env:
          PKGREL: ${{ inputs.pkgrel }}
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/vendor:/vendor" -v "$RUNNER_TEMP/rc-capture:/capture:ro" \
            -v "$RUNNER_TEMP/rc-producer/built:/task/built" -v "$RUNNER_TEMP/rc-producer/cache:/task/cache" -v "$RUNNER_TEMP/rc-producer/tmp:/task/tmp" \
            -e TMPDIR=/task/tmp -e TMP=/task/tmp -e TEMP=/task/tmp -e PKGREL omarchy-producer bash -euo pipefail -c '
              pacman -S --needed --noconfirm sudo
              useradd -m builder
              printf "builder ALL=(ALL) NOPASSWD: ALL\n" >/etc/sudoers.d/builder
              chmod 0440 /etc/sudoers.d/builder
              chown -R builder:builder /vendor /task/built /task/cache /task/tmp
              runuser -u builder -- env TMPDIR=/task/tmp TMP=/task/tmp TEMP=/task/tmp \
                OMARCHY_PKGS_PATH=/vendor/recipes OMARCHY_PACKAGE_OUTPUT=/task/built \
                OMARCHY_PACKAGE_SRCDEST=/task/cache OMARCHY_PKGREL="$PKGREL" bash /vendor/desktop/build-packages.sh
            ' 2>&1 | tee "$RUNNER_TEMP/rc-producer/logs/build.log"
          sudo chown -R "$(id -u):$(id -g)" vendor "$RUNNER_TEMP/rc-producer/built"
      - name: Stage and verify the complete configured unsigned artifact
        env:
          CAPTURE_HASH: ${{ inputs.capture_manifest_sha256 }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          EDGE_CONVERSION: ${{ inputs.edge_conversion && '1' || '0' }}
          PKGREL: ${{ inputs.pkgrel }}
        run: |
          set -euo pipefail
          docker run --rm --network none -v "$PWD:/w:ro" -w /w \
            -v "$RUNNER_TEMP/rc-capture:/capture:ro" -v "$RUNNER_TEMP/rc-producer/built:/task/built:ro" \
            -v "$RUNNER_TEMP/rc-producer/tmp:/task/tmp" -v "$RUNNER_TEMP/rc-producer/output:/output" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/w/vendor/desktop \
            -e CAPTURE_HASH -e SOURCE_COMMIT -e EDGE_CONVERSION -e PKGREL -e TMPDIR=/task/tmp -e TMP=/task/tmp -e TEMP=/task/tmp -e PYTHONDONTWRITEBYTECODE=1 \
            omarchy-producer bash -euo pipefail -c \
            'args=(--pkgrel "$PKGREL"); [[ $EDGE_CONVERSION == 0 ]] || args+=(--edge-conversion); python3 scripts/bootstrap-rc.py stage-input --capture /capture --capture-manifest-sha256 "$CAPTURE_HASH" --built /task/built --candidates /output/candidates --source /w/vendor/desktop --source-commit "$SOURCE_COMMIT" --output /output/bundle "${args[@]}"' \
            2>&1 | tee "$RUNNER_TEMP/rc-producer/logs/stage.log"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/rc-producer/output/bundle"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-rc-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rc-producer/output/bundle/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rc-baseline-preparation-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rc-producer/logs/
          if-no-files-found: warn
          retention-days: 90
