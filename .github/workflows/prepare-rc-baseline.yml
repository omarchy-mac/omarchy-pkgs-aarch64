name: Prepare complete baseline artifact

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: 'Reviewed exact desktop source commit, with fork keyring bootstrap support'
        type: string
        required: true
      baseline_lane:
        description: 'Use edge for initial RC4 or final edge conversion; published rc for RC5'
        type: choice
        options: [rc, edge]
        default: rc
        required: true
      edge_conversion:
        description: 'Prepare final stable edge signing conversion; require identical existing package payloads and reuse exact archive bytes'
        type: boolean
        required: true
        default: false
      baseline_database_sha256:
        description: 'Approved selected baseline omarchy-aarch64.db.tar.zst SHA256'
        type: string
        required: true
      target_database_sha256:
        description: 'Approved target-lane omarchy-aarch64.db.tar.zst SHA256 for partial-lane reconciliation'
        type: string
        required: true
      pkgrel:
        description: 'Explicit package release number for this rebuild; bump when package bytes or metadata change'
        type: string
        required: true

concurrency:
  group: rc-baseline-producer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    environment: package-signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate immutable inputs
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          EDGE_CONVERSION: ${{ inputs.edge_conversion && '1' || '0' }}
          BASE_HASH: ${{ inputs.baseline_database_sha256 }}
          TARGET_HASH: ${{ inputs.target_database_sha256 }}
          PKGREL: ${{ inputs.pkgrel }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ && "$BASE_HASH" =~ ^[a-f0-9]{64}$ && "$TARGET_HASH" =~ ^[a-f0-9]{64}$ && "$PKGREL" =~ ^[1-9][0-9]*$ ]]
          case $(findmnt -n -o FSTYPE -T "$RUNNER_TEMP") in ''|tmpfs|ramfs) exit 1;; esac
          mkdir -p "$RUNNER_TEMP/rc-producer"/{tmp,cache,built,logs}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: omarchy-mac/omarchy-mac
          ref: ${{ inputs.source_commit }}
          path: vendor/desktop
          persist-credentials: false
      - name: Preflight target package identities before building
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKGREL: ${{ inputs.pkgrel }}
          EDGE_CONVERSION: ${{ inputs.edge_conversion && '1' || '0' }}
        run: |
          set -euo pipefail
          version=$(cat vendor/desktop/version)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+rc[1-9][0-9]*$ || "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          target=edge
          [[ "$EDGE_CONVERSION" == 1 ]] || target=rc
          assets_json=$(gh api "repos/omarchy-mac/omarchy-pkgs-aarch64/releases/tags/$target")
          assets=$(jq -r '.assets[].name' <<<"$assets_json")
          if [[ "$EDGE_CONVERSION" != 1 ]]; then
            for package in omarchy omarchy-settings; do
              candidate="$package-$version-$PKGREL-aarch64.pkg.tar.xz"
              if grep -Fqx "$candidate" <<<"$assets"; then
                echo "Target lane $target already contains $candidate; choose a new pkgrel" >&2
                exit 1
              fi
            done
          fi
      - name: Read exact recipe pin
        id: recipe
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          EDGE_CONVERSION: ${{ inputs.edge_conversion && '1' || '0' }}
        run: |
          set -euo pipefail
          [[ $(git -C vendor/desktop rev-parse HEAD) == "$SOURCE_COMMIT" ]]
          pin=$(cat vendor/desktop/build-inputs/omarchy-pkgs-revision)
          [[ "$pin" =~ ^[a-f0-9]{40}$ ]]
          echo "revision=$pin" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: omacom/omarchy-pkgs
          ref: ${{ steps.recipe.outputs.revision }}
          path: vendor/recipes
          persist-credentials: false
      - name: Prepare tools without signing credentials
        run: docker build --build-arg BASE_IMAGE=menci/archlinuxarm:base-devel -f .github/publisher.Dockerfile -t omarchy-producer .
      - name: Capture approved complete selected baseline read-only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_LANE: ${{ inputs.baseline_lane }}
          BASE_HASH: ${{ inputs.baseline_database_sha256 }}
          TARGET_HASH: ${{ inputs.target_database_sha256 }}
          EDGE_CONVERSION: ${{ inputs.edge_conversion && '1' || '0' }}
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/w:ro" -w /w -v "$RUNNER_TEMP/rc-producer:/task" \
            -e GH_TOKEN -e BASE_HASH -e BASE_LANE -e TARGET_HASH -e EDGE_CONVERSION -e TMPDIR=/task/tmp -e TMP=/task/tmp -e TEMP=/task/tmp \
            -e PYTHONDONTWRITEBYTECODE=1 omarchy-producer bash -euo pipefail -c \
            'args=(--lane "$BASE_LANE" --database-sha256 "$BASE_HASH" --output /task/capture); [[ "$BASE_LANE" == edge && "$EDGE_CONVERSION" == 0 ]] && args+=(--overlay-lane rc --overlay-database-sha256 "$TARGET_HASH"); python3 scripts/bootstrap-rc.py capture "${args[@]}"' \
            2>&1 | tee "$RUNNER_TEMP/rc-producer/logs/capture.log"
      - name: Build the canonical exact-source package inputs on ARM
        env:
          PKGREL: ${{ inputs.pkgrel }}
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/vendor:/vendor" -v "$RUNNER_TEMP/rc-producer:/task" \
            -e TMPDIR=/task/tmp -e TMP=/task/tmp -e TEMP=/task/tmp -e PKGREL omarchy-producer bash -euo pipefail -c '
              pacman -S --needed --noconfirm sudo
              useradd -m builder
              printf "builder ALL=(ALL) NOPASSWD: ALL\n" >/etc/sudoers.d/builder
              chmod 0440 /etc/sudoers.d/builder
              chown -R builder:builder /vendor /task/built /task/cache /task/tmp
              runuser -u builder -- env TMPDIR=/task/tmp TMP=/task/tmp TEMP=/task/tmp \
                OMARCHY_PKGS_PATH=/vendor/recipes OMARCHY_PACKAGE_OUTPUT=/task/built \
                OMARCHY_PACKAGE_SRCDEST=/task/cache OMARCHY_PKGREL="$PKGREL" bash /vendor/desktop/build-packages.sh
            ' 2>&1 | tee "$RUNNER_TEMP/rc-producer/logs/build.log"
          sudo chown -R "$(id -u):$(id -g)" vendor "$RUNNER_TEMP/rc-producer/built"
      - name: Stage and verify the complete configured unsigned artifact
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          EDGE_CONVERSION: ${{ inputs.edge_conversion && '1' || '0' }}
          PKGREL: ${{ inputs.pkgrel }}
        run: |
          set -euo pipefail
          docker run --rm --network none -v "$PWD:/w:ro" -w /w -v "$RUNNER_TEMP/rc-producer:/task" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/w/vendor/desktop \
            -e SOURCE_COMMIT -e EDGE_CONVERSION -e PKGREL -e TMPDIR=/task/tmp -e TMP=/task/tmp -e TEMP=/task/tmp -e PYTHONDONTWRITEBYTECODE=1 \
            omarchy-producer bash -euo pipefail -c \
            'args=(--pkgrel "$PKGREL"); [[ $EDGE_CONVERSION == 0 ]] || args+=(--edge-conversion); python3 scripts/bootstrap-rc.py stage-input --capture /task/capture --built /task/built --candidates /task/candidates --source /w/vendor/desktop --source-commit "$SOURCE_COMMIT" --output /task/bundle "${args[@]}"' \
            2>&1 | tee "$RUNNER_TEMP/rc-producer/logs/stage.log"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/rc-producer/bundle"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-rc-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rc-producer/bundle/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rc-baseline-preparation-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rc-producer/logs/
          if-no-files-found: warn
          retention-days: 90
