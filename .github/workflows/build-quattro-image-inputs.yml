name: Build quattro image inputs

# Scheduled checks, manual builds and PR validation retain artifacts only.
# This workflow never creates releases or changes a pacman database.
on:
  schedule:
    - cron: '23 * * * *'
  pull_request:
    paths:
      - .github/workflows/build-quattro-image-inputs.yml
      - scripts/build-quattro-image-inputs.py
      - scripts/test-quattro-image-inputs.py
      - scripts/detect-quattro-image-inputs.py
      - scripts/test-quattro-image-inputs-detection.py
      - scripts/quattro-image-inputs-*-revision
      - scripts/container-bootstrap.sh
      - scripts/prepare-omarchy-recipes.sh
      - patches/omarchy-first-run-packages.patch
      - patches/quattro-desktop-test-fixtures.patch
      - pkgbuilds/omarchy-steam-fex/omarchy-launch-steam
      - pkgbuilds/omarchy-mac/**
  push:
    branches: [main]
    paths:
      - .github/workflows/build-quattro-image-inputs.yml
      - scripts/build-quattro-image-inputs.py
      - scripts/test-quattro-image-inputs.py
      - scripts/detect-quattro-image-inputs.py
      - scripts/test-quattro-image-inputs-detection.py
      - scripts/quattro-image-inputs-*-revision
      - scripts/container-bootstrap.sh
      - scripts/prepare-omarchy-recipes.sh
      - patches/omarchy-first-run-packages.patch
      - patches/quattro-desktop-test-fixtures.patch
      - pkgbuilds/omarchy-steam-fex/omarchy-launch-steam
      - pkgbuilds/omarchy-mac/**
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if a matching successful candidate is retained
        required: false
        default: false
        type: boolean
      source_ref:
        description: 'omacom/omarchy-mac ref to resolve once for all three packages'
        required: true
        default: quattro-upstream
        type: string

permissions:
  contents: read

# Serialize main's scheduled, push and manual requests without interrupting an
# in-flight artifact upload. PR validation uses its own ref.
concurrency:
  group: quattro-image-inputs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: Check candidate inputs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      source_sha: ${{ steps.detect.outputs.source_sha }}
      recipe_sha: ${{ steps.detect.outputs.recipe_sha }}
      artifact_name: ${{ steps.detect.outputs.artifact_name }}
      needs_build: ${{ steps.detect.outputs.needs_build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test candidate detection
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-quattro-image-inputs-detection.py
      - name: Resolve source and check retained successful builds
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.source_ref || 'quattro-upstream' }}
          FORCE_BUILD: ${{ github.event_name == 'pull_request' || inputs.force || false }}
        run: python3 scripts/detect-quattro-image-inputs.py

  build:
    name: Build three candidate packages
    needs: detect
    if: needs.detect.outputs.needs_build == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.detect.outputs.recipe_sha }}
          persist-credentials: false
      - name: Read the upstream recipe pin
        id: recipes
        shell: bash
        run: |
          revision=$(cat scripts/quattro-image-inputs-recipes-revision)
          [[ $revision =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          iso_revision=$(cat scripts/quattro-image-inputs-iso-revision)
          [[ $iso_revision =~ ^[0-9a-f]{40}$ ]]
          echo "iso_revision=$iso_revision" >> "$GITHUB_OUTPUT"
      - name: Check out the selected desktop source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: omacom/omarchy-mac
          ref: ${{ needs.detect.outputs.source_sha }}
          path: vendor/desktop
          persist-credentials: false
      - name: Check out the recorded upstream recipes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: omacom/omarchy-pkgs
          ref: ${{ steps.recipes.outputs.revision }}
          path: vendor/recipes
          persist-credentials: false
      - name: Check out the ISO source for desktop contract tests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: omacom/omarchy-iso
          ref: ${{ steps.recipes.outputs.iso_revision }}
          path: vendor/iso-tests
          persist-credentials: false
      - name: Build and audit without installation or publication
        shell: bash
        run: |
          source_sha=$(git -C vendor/desktop rev-parse HEAD)
          # Nested checkouts and outputs are disposable build inputs, not edits
          # to the package repository; retain the clean-tree provenance check.
          printf '/vendor/\n/candidate/\n/candidate-build.log\n' >> .git/info/exclude
          docker pull menci/archlinuxarm:base-devel
          build_image=$(docker image inspect menci/archlinuxarm:base-devel --format '{{index .RepoDigests 0}}')
          docker run --rm -v "$PWD:/w" -w /w \
            -e SOURCE_SHA="$source_sha" -e CANDIDATE_BUILD_IMAGE="$build_image" \
            -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT \
            "$build_image" bash -euo pipefail -c '
              bash scripts/container-bootstrap.sh build
              pacman -S --noconfirm --needed python systemd imagemagick nodejs \
                lua ffmpeg plocate libxkbcommon xkeyboard-config glib2 openssh pciutils \
                ripgrep gum desktop-file-utils inetutils
              useradd --create-home builder
              chown -R builder:builder /w
              runuser -u builder -- python3 scripts/build-quattro-image-inputs.py \
                /w/vendor/desktop "$SOURCE_SHA" /w/vendor/recipes /w/vendor/iso-tests /w/candidate \
                "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            ' 2>&1 | tee candidate-build.log
      - name: Retain diagnostic logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quattro-image-inputs-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            candidate-build.log
            candidate/logs/
          if-no-files-found: warn
          retention-days: 30
      - name: Retain the complete candidate set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ needs.detect.outputs.artifact_name }}
          path: candidate/artifacts/
          include-hidden-files: true
          overwrite: true
          if-no-files-found: error
          retention-days: 30
