name: Update packages

# Builds run on ubuntu-24.04-arm, which is free for public repos; detection and
# publishing run on x86 because nothing about them is architecture-specific.
# All three categories are automated. Packages marked skip in packages.json are
# never touched, and VCS packages rebuild on a timer rather than a version diff.

on:
  schedule:
    # Cheap no-op most runs: detection is one AUR RPC call plus one db fetch.
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      packages:
        description: 'Comma-separated pkgnames (blank = everything in scope)'
        required: false
        default: ''
      categories:
        description: 'Categories to consider: any, repack, compile'
        required: false
        default: 'any,repack,compile'
      dry_run:
        description: 'Build and verify, but do not touch the release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

# One mutable db on one rolling tag: two overlapping runs would clobber each
# other's repo-add. Never cancel a run that may be mid-upload.
concurrency:
  group: edge-publish
  cancel-in-progress: false

env:
  # Arch Linux ARM, aarch64, running natively on the ARM runner. Builds need a
  # real aarch64 environment — see scripts/build-package.sh for why forcing
  # CARCH in an x86 container is not equivalent.
  ARCH_IMAGE_ARM: menci/archlinuxarm:base-devel
  # Detection and publishing need vercmp, repo-add, jq and gh, none of which
  # care about the target architecture. Running them natively on x86 avoids
  # emulating a full `pacman -Syu`, which is minutes of qemu for no benefit.
  ARCH_IMAGE_X86: archlinux:base-devel

jobs:
  detect:
    name: Detect updates
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_updates: ${{ steps.detect.outputs.has_updates }}
      packages: ${{ steps.detect.outputs.packages }}
    steps:
      - uses: actions/checkout@v4

      - name: Compare upstream against the published db
        id: detect
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CATEGORIES: ${{ inputs.categories || 'any,repack,compile' }}
          PACKAGES: ${{ inputs.packages }}
        run: |
          : > .gh_output
          docker run --rm -v "$PWD:/w" -w /w \
            -e GH_REPO -e GH_TOKEN -e CATEGORIES -e PACKAGES \
            -e GITHUB_OUTPUT=/w/.gh_output \
            "$ARCH_IMAGE_X86" bash -c \
            'bash scripts/container-bootstrap.sh >/dev/null && bash scripts/detect-updates.sh'
          cat .gh_output >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.pkgbase }}
    needs: detect
    if: needs.detect.outputs.has_updates == 'true'
    runs-on: ${{ matrix.runs_on }}
    # A build that wedges should fail fast, not sit in the queue for hours.
    timeout-minutes: 90
    strategy:
      # One broken PKGBUILD must not stop the other packages from shipping.
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        env:
          PKGBASE: ${{ matrix.pkgbase }}
          SOURCE: ${{ matrix.source }}
          CATEGORY: ${{ matrix.category }}
          PKGNAMES: ${{ matrix.pkgnames }}
          IGNOREARCH: ${{ matrix.ignorearch }}
          EXTRA_MAKEDEPENDS: ${{ matrix.extra_makedepends }}
          ALLOW_FOREIGN_ELF: ${{ matrix.allow_foreign_elf }}
          EXCLUDE_BUILD_DEPS: ${{ matrix.exclude_build_deps }}
        run: |
          mkdir -p staging
          docker run --rm -v "$PWD:/w" -w /w \
            -e PKGBASE -e SOURCE -e CATEGORY -e PKGNAMES -e IGNOREARCH \
            -e EXTRA_MAKEDEPENDS -e ALLOW_FOREIGN_ELF -e EXCLUDE_BUILD_DEPS \
            -e OUTDIR=/w/staging \
            "$ARCH_IMAGE_ARM" bash -c \
            'bash scripts/container-bootstrap.sh build >/dev/null && bash scripts/build-package.sh'
          sudo chown -R "$(id -u):$(id -g)" staging
          ls -la staging

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.pkgbase }}
          path: staging/*.pkg.tar.*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to edge
    needs: [detect, build]
    # always(): publish whatever did build, even if a sibling package failed.
    if: always() && needs.detect.outputs.has_updates == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: staging

      - name: Check something was built
        id: staged
        run: |
          shopt -s nullglob
          pkgs=(staging/*.pkg.tar.*)
          echo "count=${#pkgs[@]}" >> "$GITHUB_OUTPUT"
          if (( ${#pkgs[@]} == 0 )); then
            echo "::warning::No packages were built — every build job failed. Nothing to publish."
          else
            printf '%s\n' "${pkgs[@]}"
          fi

      - name: Publish packages and regenerate the db
        if: steps.staged.outputs.count != '0'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          mkdir -p .newdb
          docker run --rm -v "$PWD:/w" -w /w \
            -e GH_REPO -e GH_TOKEN -e DRY_RUN \
            -e PKGDIR=/w/staging -e DB_OUT=/w/.newdb \
            "$ARCH_IMAGE_X86" bash -c \
            'bash scripts/container-bootstrap.sh >/dev/null && bash scripts/publish.sh'
          sudo chown -R "$(id -u):$(id -g)" .newdb

      - name: Smoke-test the published repo
        if: steps.staged.outputs.count != '0' && !inputs.dry_run
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          docker run --rm -v "$PWD:/w" -w /w \
            -e GH_REPO \
            "$ARCH_IMAGE_X86" bash -c \
            'bash scripts/container-bootstrap.sh >/dev/null && bash scripts/smoke-test.sh'

      - name: Sync the README version table
        if: steps.staged.outputs.count != '0' && !inputs.dry_run
        run: |
          docker run --rm -v "$PWD:/w" -w /w \
            -e DB=/w/.newdb/omarchy-aarch64.db.tar.zst \
            "$ARCH_IMAGE_X86" bash -c \
            'bash scripts/container-bootstrap.sh >/dev/null && bash scripts/update-readme.sh'
          sudo chown "$(id -u):$(id -g)" README.md
          if git diff --quiet -- README.md; then
            echo "README already matches the db"
          else
            git config user.name  'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add README.md
            git commit \
              -m "Sync README versions with the published repo" \
              -m "Updated for: ${{ needs.detect.outputs.packages }}"
            git push
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Packages detected as out of date"
            echo ""
            echo '`${{ needs.detect.outputs.packages }}`'
            echo ""
            echo "Artifacts staged: ${{ steps.staged.outputs.count }}"
            echo "Dry run: ${{ inputs.dry_run || false }}"
          } >> "$GITHUB_STEP_SUMMARY"

  notify:
    name: Report failure
    needs: [detect, build, publish]
    # A red run nobody looks at is the same as no CI. This turns a failed
    # scheduled run into something that shows up in the repo's issues.
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PACKAGES: ${{ needs.detect.outputs.packages }}
        run: |
          title="CI: package update run failed"
          body="$(printf '%s\n\n%s\n\n%s\n' \
            "A \`${{ github.workflow }}\` run (\`${{ github.event_name }}\`) failed." \
            "Packages in scope: \`${PACKAGES:-none}\`" \
            "Run: $RUN_URL")"

          # Match on title so repeated failures append rather than pile up.
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title $title" --json number,title \
            --jq "[.[] | select(.title == \"$title\")] | .[0].number // empty")"

          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
            echo "Commented on existing issue #$existing"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
