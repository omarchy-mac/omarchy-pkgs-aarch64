name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  self-tests:
    name: Self-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # An Arch container for vercmp: whether one version supersedes another has
      # to be decided by the same comparator pacman will use on users' machines.
      # Everything else here is offline, so x86 is fine — the ELF fixtures are
      # synthesised headers rather than real binaries.
      - name: Run self-tests
        run: |
          docker run --rm -v "$PWD:/w" -w /w archlinux:base-devel bash -c '
            set -euo pipefail
            mkdir -p /w/.test-tmp
            export TMPDIR=/w/.test-tmp TMP=/w/.test-tmp TEMP=/w/.test-tmp
            pacman -Syu --noconfirm --needed jq zstd python python-yaml git gnupg >/dev/null
            bash scripts/self-test.sh
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-package-signing.py -v
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-signature-trust.py
            NATIVE_VERCMP=1 PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-keyring-eligibility.py -v
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-release-bundle.py -v
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-bootstrap-rc.py -v
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-capture-handoff.py -v
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-inspect-capture.py -v
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-edge-publishing.py -v
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-quattro-image-inputs.py -v
          '
